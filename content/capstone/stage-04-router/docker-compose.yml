# Stage 4: three model replicas, two gateways that route between them, Nginx in front of the gateways.
#   client -> nginx :8080 (L7, round robin) -> gateway-a | gateway-b -> router -> llm-1 | llm-2 | llm-3
# The gateways are also published on 8091 and 8092 so you can read each one's /admin/replicas.
x-llm: &llm
  image: ghcr.io/ggml-org/llama.cpp:server-b6075
  command:
    - --model
    - /models/qwen2.5-0.5b-instruct-q4_k_m.gguf
    - --alias
    - qwen2.5-0.5b-instruct
    - --host
    - 0.0.0.0
    - --port
    - "8080"
    - --ctx-size
    - "8192"
    - --parallel
    - "4"
    - --threads
    - ${LLM_THREADS:-2}
    - --metrics
  volumes:
    - ./models:/models:ro
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
    interval: 5s
    timeout: 3s
    retries: 30
    start_period: 10s
  restart: unless-stopped

x-gateway: &gateway
  build: .
  image: llm-gateway:stage-04
  depends_on:
    postgres:
      condition: service_healthy
    llm-1:
      condition: service_healthy
    llm-2:
      condition: service_healthy
    llm-3:
      condition: service_healthy
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
    interval: 5s
    timeout: 3s
    retries: 5
  restart: unless-stopped

x-gateway-env: &gateway-env
  PORT: "8080"
  LLM_REPLICAS: http://llm-1:8080,http://llm-2:8080,http://llm-3:8080
  ROUTER_POLICY: ${ROUTER_POLICY:-prefix_affinity}
  AFFINITY_MAX_OUTSTANDING: "4"
  MODEL_NAME: qwen2.5-0.5b-instruct
  DATABASE_URL: postgres://app:app@postgres:5432/llm
  DB_POOL_MAX: "10"
  # Each replica has 4 llama.cpp slots and there are 2 gateways, so each gateway may use 2 per replica.
  # Static partitioning is simple; its cost is that one gateway cannot borrow the other's idle slots.
  SLOTS_PER_REPLICA: "2"
  MAX_QUEUE: ${MAX_QUEUE:-8}
  MAX_QUEUE_WAIT_MS: "5000"
  CONTEXT_PER_SLOT: "2048"

services:
  nginx:
    image: nginx:1.27.4-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      gateway-a:
        condition: service_healthy
      gateway-b:
        condition: service_healthy
    restart: unless-stopped

  gateway-a:
    <<: *gateway
    environment:
      <<: *gateway-env
      INSTANCE_ID: gateway-a
    ports:
      - "8091:8080"

  gateway-b:
    <<: *gateway
    environment:
      <<: *gateway-env
      INSTANCE_ID: gateway-b
    ports:
      - "8092:8080"

  llm-1:
    <<: *llm
  llm-2:
    <<: *llm
  llm-3:
    <<: *llm

  postgres:
    image: postgres:17.4-alpine3.21
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: llm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U app -d llm"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
