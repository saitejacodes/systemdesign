# The -otel variant of the official image ships the OpenTelemetry module (ngx_otel_module).
load_module modules/ngx_otel_module.so;

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  # gw = which gateway answered, rt = total time, urt = time to the gateway's last byte.
  # trace=... puts the trace id in every access log line, so a log line leads straight to its trace in Jaeger.
  log_format main '$remote_addr "$request" $status $body_bytes_sent rt=$request_time urt=$upstream_response_time gw=$upstream_addr trace=$otel_trace_id';
  access_log /dev/stdout main;
  error_log /dev/stderr warn;

  # Tracing: nginx starts (or continues) a trace for every request, exports its span to Jaeger over OTLP/gRPC,
  # and "propagate" both reads an incoming traceparent header and sends nginx's own one to the gateway, so the
  # gateway's spans become children of the nginx span.
  otel_exporter {
    endpoint jaeger:4317;
  }
  otel_service_name nginx;
  otel_trace on;
  otel_trace_context propagate;

  # Docker's embedded DNS; "resolve" below re-resolves gateway names if a container restarts with a new IP
  # (open-source nginx 1.27.3 and later).
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Layer 7: nginx terminates HTTP, reads the request, and can route on path or headers, retry, and log status codes.
  # (A layer 4 "stream {}" proxy would only forward TCP bytes: cheaper, but blind to requests and responses.)
  upstream gateways {
    zone gateways 64k;
    server gateway-a:8080 resolve max_fails=3 fail_timeout=10s;
    server gateway-b:8080 resolve max_fails=3 fail_timeout=10s;
    keepalive 32;
  }

  server {
    listen 80;

    location = /nginx-health {
      access_log off;
      return 200 "ok\n";
    }

    # Operator endpoints stay off the public entry point: reach them on the gateways' own ports instead.
    location ^~ /admin/ {
      return 404;
    }
    location = /metrics {
      return 404;
    }

    location / {
      proxy_pass http://gateways;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      # Streaming: pass each SSE event on as soon as it arrives instead of buffering the response.
      proxy_buffering off;
      proxy_cache off;
      # A generation can be silent for a long time while queued and prefilling: allow it, but not forever.
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
      proxy_connect_timeout 2s;
      # Only retry another gateway when the connection failed before anything was sent. POSTs are never
      # retried here (that would need "non_idempotent"), so a generation is not started twice.
      proxy_next_upstream error;
      proxy_next_upstream_tries 2;
    }
  }
}
