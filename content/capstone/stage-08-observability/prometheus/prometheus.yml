global:
  scrape_interval: 5s      # short for a lab, so graphs react within seconds; 15-60s is typical in production
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: gateway
    static_configs:
      - targets: ["gateway-a:8080", "gateway-b:8080"]

  - job_name: worker
    static_configs:
      - targets: ["worker:9100"]

  # llama.cpp's own metrics (started with --metrics): tokens processed, requests processing and deferred.
  - job_name: llama
    static_configs:
      - targets: ["llm-1:8080", "llm-2:8080", "llm-3:8080"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
