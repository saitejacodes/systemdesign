<!doctype html>

<title>SysDesign Lab: Field Manual</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--paper); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; width:960px; height:320px; overflow:hidden; }
  .band { position:absolute; left:0; top:0; width:960px; height:112px; }
  .ink { fill:var(--ink); } .cob { fill:var(--cobalt); } .cor { fill:var(--phase-3); } .sag { fill:var(--phase-1); } .lav { fill:var(--phase-5); }
  .cut { fill:var(--paper); }
  .rule { stroke:var(--ink); stroke-width:1; }
  .blk { rx:var(--radius-0); }
  .words { position:absolute; left:var(--space-6); bottom:var(--space-6); max-width:900px; }
  .name { margin:0; font-family:var(--font-display); font-size:64px; line-height:.95; font-weight:800; letter-spacing:-.035em; color:var(--ink); }
  .tag { margin:var(--space-3) 0 0 2px; font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
</head>

  arrangement a strip of unequal bands, bottoms on one line at 112, space-4 gutters: the iso layer stack read as a strip of plates
