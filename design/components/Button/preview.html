<!doctype html>
<html lang="en" data-theme="paper"><!-- switch to data-theme="blueprint" for the dark theme -->
<head>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../components.css"><meta charset="utf-8"><title>Button — preview</title></head>
<body>
<div class="fm-pad fm-col" style="gap:20px">
  <div class="fm-row"><button class="fm-btn fm-btn--primary">Start week 1 <span class="arr">→</span></button><button class="fm-btn fm-btn--primary is-hover">Hover</button><button class="fm-btn fm-btn--primary is-focus">Focus</button><button class="fm-btn fm-btn--primary is-active">Pressed</button><button class="fm-btn fm-btn--primary" disabled>Disabled</button></div>
  <div class="fm-row"><button class="fm-btn">Open a simulator</button><button class="fm-btn is-hover">Hover</button><button class="fm-btn is-focus">Focus</button><button class="fm-btn" disabled>Disabled</button><button class="fm-btn fm-btn--danger">Reset progress</button></div>
  <div class="fm-row"><button class="fm-btn fm-btn--tool">▶ Play</button><button class="fm-btn fm-btn--tool">⏸ Pause</button><button class="fm-btn fm-btn--tool">Step</button><button class="fm-btn fm-btn--tool is-on">1×</button><button class="fm-btn fm-btn--tool is-hover">Copy</button><button class="fm-btn fm-btn--tool" disabled>Reset</button></div>
</div>
</body>
</html>
