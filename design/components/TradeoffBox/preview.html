<div class="fm-box__head"><span class="fm-box__glyph" aria-hidden="true">⇄</span>Tradeoff · Async replication</div>
<div class="fm-tradeoff"><div class="gain"><h5>+ Gain</h5><ul style="margin:0;padding-left:18px;display:grid;gap:6px"><li>Writes return as soon as the leader commits</li><li>Followers can lag or fail without blocking writes</li></ul></div><div class="cost"><h5>− Cost</h5><ul style="margin:0;padding-left:18px;display:grid;gap:6px"><li>Stale reads from followers</li><li>Unreplicated writes are lost on failover</li></ul></div></div>
</div></div>
